name: Generate SoS Story Ideas

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of stories to generate"
        required: true
        default: "5"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install openai langchain faiss-cpu

      - name: Generate Stories
        run: |
          python scripts/generate_stories.py --count ${{ github.event.inputs.count }}

      - name: Commit Updated stories.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stories.json
          git commit -m "Generated new story ideas" || echo "No changes"
          git push
