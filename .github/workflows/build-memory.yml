name: Rebuild SoS FAISS Story Memory

on:
  workflow_dispatch:
    inputs:
      include_unused:
        description: "Include unused story ideas in memory too?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  memory:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build FAISS Story Memory
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.include_unused }}" = "true" ]; then
            python scripts/build_vector_store.py --include-unused
          else
            python scripts/build_vector_store.py
          fi

      - name: Commit Vector Store
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vector_store/stories.faiss vector_store/metadata.json
          git commit -m "Rebuild SoS FAISS story memory" || echo "No changes"
          git push
