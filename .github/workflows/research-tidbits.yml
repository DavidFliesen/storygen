name: Build or Refresh SoS Research Tidbits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Research Tidbits
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/research_tidbits.py

      - name: Commit Updated Tidbits
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/tidbits-*.json
          git commit -m "Refresh SoS research tidbits" || echo "No changes"
          git push
